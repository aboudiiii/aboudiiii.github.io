name = "hayali-reviews"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Created with: npx wrangler d1 create hayali  (paste the printed database_id below)
[[d1_databases]]
binding = "DB"
database_name = "hayali"
database_id = "PUT_D1_ID_HERE"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://aboudiiii.github.io"
SITE_URL = "https://aboudiiii.github.io"
CHANNEL_URL = "https://t.me/AlHayaliLibrary"   # news channel link: shows a join button after registration/login
MAIL_FROM_NAME = "مكتبة الحيالي الرقمية"
# MAIL_FROM = "your-verified-sender@example.com"   <- set to the sender you verified in Brevo

# Secrets (npx wrangler secret put NAME):
#   TG_TOKEN, TG_CHANNEL (@username or -100... id of the news channel), TG_OWNER_ID, TG_WEBHOOK_SECRET, RATE_SALT, BOT_API_KEY, BREVO_API_KEY

# 05:00 UTC (08:00 Baghdad): owner report + channel post. 11:00 and 17:00 UTC (14:00, 20:00 Baghdad): channel post.
[triggers]
crons = ["0 5 * * *", "0 11 * * *", "0 17 * * *"]
