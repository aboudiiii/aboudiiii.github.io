name = "hayali-reviews"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Created with: npx wrangler d1 create hayali  (paste the printed database_id below)
[[d1_databases]]
binding = "DB"
database_name = "hayali"
database_id = "PUT_D1_ID_HERE"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://aboudiiii.github.io"
SITE_URL = "https://aboudiiii.github.io"
CHANNEL_URL = ""   # public link of the news channel, e.g. https://t.me/yourchannel (shows a join button after registration/login)
MAIL_FROM_NAME = "مكتبة الحيالي الرقمية"
# MAIL_FROM = "your-verified-sender@example.com"   <- set to the sender you verified in Brevo

# Secrets (npx wrangler secret put NAME):
#   TG_TOKEN, TG_OWNER_ID, TG_WEBHOOK_SECRET, RATE_SALT, BOT_API_KEY, BREVO_API_KEY

# Daily owner report at 08:00 Baghdad time (05:00 UTC).
[triggers]
crons = ["0 5 * * *"]
