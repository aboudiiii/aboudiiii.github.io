name: Post to Telegram channel

# Three posts a day, about 08:00, 14:00 and 20:00 Baghdad time (05:07, 11:13 and 17:11 UTC; off the top of the hour because GitHub delays/drops :00 runs).
# If you change the number of runs, update POSTS_PER_DAY in scripts/post_to_telegram.py.
on:
  schedule:
    - cron: "7 5 * * *"
    - cron: "13 11 * * *"
    - cron: "11 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the post, do not send"
        type: boolean
        default: true
      slug:
        description: "Optional: post this product slug instead of the rotation's pick"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Post the next product
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}  # same announcements-bot token the Worker already uses
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/post_to_telegram.py --dry-run ${SLUG:+--slug "$SLUG"}
          else
            python3 scripts/post_to_telegram.py ${SLUG:+--slug "$SLUG"}
          fi
