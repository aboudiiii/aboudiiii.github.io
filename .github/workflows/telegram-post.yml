name: Post to Telegram channel

# Scheduled posting now runs on Cloudflare cron (worker/src/autopost.js, 3 posts a day). This workflow is manual only
# (Actions -> Run workflow): untick dry_run to post one now; optional slug picks a product.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the post, do not send"
        type: boolean
        default: true
      slug:
        description: "Optional: post this product slug instead of the rotation's pick"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Post the next product
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_TOKEN }}  # same announcements-bot token the Worker already uses
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/post_to_telegram.py --dry-run ${SLUG:+--slug "$SLUG"}
          else
            python3 scripts/post_to_telegram.py ${SLUG:+--slug "$SLUG"}
          fi
