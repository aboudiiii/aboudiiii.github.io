name: Check site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site checks
        run: python3 scripts/check_site.py
      - name: Security regression checks
        run: python3 scripts/security_check.py
      - name: Test reviews Worker
        run: cd worker && npm test
