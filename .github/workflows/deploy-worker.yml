name: Deploy worker
# Manual: Actions tab -> "Deploy worker" -> Run workflow. Needs the repo secrets listed in worker/README.ar.md.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Create D1 database (if missing) and put its id in wrangler.toml
        run: |
          npx wrangler@4 d1 create hayali || echo "already exists"
          ID=$(npx wrangler@4 d1 list --json | jq -r '.[] | select(.name=="hayali") | .uuid')
          test -n "$ID"
          sed -i "s/PUT_D1_ID_HERE/$ID/" wrangler.toml
      - name: Apply migrations
        run: npx wrangler@4 d1 migrations apply hayali --remote
      - name: Deploy
        run: npx wrangler@4 deploy
      - name: Secrets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
          RATE_SALT: ${{ secrets.RATE_SALT }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          for n in TG_TOKEN TG_OWNER_ID TG_WEBHOOK_SECRET RATE_SALT BOT_API_KEY BREVO_API_KEY MAIL_FROM; do
            v="${!n}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler@4 secret put "$n"; else echo "skip $n (empty)"; fi
          done
