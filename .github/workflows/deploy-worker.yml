name: Deploy worker
# Manual: Actions tab -> "Deploy worker" -> Run workflow. Needs the repo secrets listed in worker/README.ar.md.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      SHOP_TG_TOKEN: ${{ secrets.SHOP_TG_TOKEN }}
      SHOP_TG_WEBHOOK_SECRET: ${{ secrets.SHOP_TG_WEBHOOK_SECRET }}
      SHOP_OWNER_ID: ${{ secrets.SHOP_OWNER_ID }}
      SHOP_PAYMENT_INSTRUCTIONS: ${{ secrets.SHOP_PAYMENT_INSTRUCTIONS }}
      SHOP_BOT_USERNAME: ${{ secrets.SHOP_BOT_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required deployment secrets
        run: |
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID SHOP_TG_TOKEN SHOP_TG_WEBHOOK_SECRET SHOP_OWNER_ID SHOP_PAYMENT_INSTRUCTIONS SHOP_BOT_USERNAME; do
            if [ -z "${!n}" ]; then echo "::error::Missing required GitHub Actions secret: $n"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Validate and pin the existing production D1 database
        run: |
          if ! [[ "$CLOUDFLARE_D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID must be the existing hayali D1 UUID."
            exit 1
          fi
          sed -i "s/PUT_D1_ID_HERE/$CLOUDFLARE_D1_DATABASE_ID/" wrangler.toml
          ! grep -q "PUT_D1_ID_HERE" wrangler.toml
      - name: Ensure private ShopBot R2 bucket exists
        run: |
          if ! npx wrangler@4 r2 bucket list --json | jq -e '.[] | select(.name=="hayali-shop-files")' >/dev/null; then
            npx wrangler@4 r2 bucket create hayali-shop-files
          fi
      - name: Back up existing D1 before migrations
        run: npx wrangler@4 d1 export hayali --remote --output=/tmp/hayali-before-shopbot-migrations.sql
      - name: Store D1 backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: hayali-d1-pre-shopbot-backup
          path: /tmp/hayali-before-shopbot-migrations.sql
          retention-days: 14
      - name: Apply migrations
        run: npx wrangler@4 d1 migrations apply hayali --remote
      - name: Deploy
        run: npx wrangler@4 deploy
      - name: Secrets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
          RATE_SALT: ${{ secrets.RATE_SALT }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SHOP_TG_TOKEN: ${{ secrets.SHOP_TG_TOKEN }}
          SHOP_TG_WEBHOOK_SECRET: ${{ secrets.SHOP_TG_WEBHOOK_SECRET }}
          SHOP_OWNER_ID: ${{ secrets.SHOP_OWNER_ID }}
          SHOP_PAYMENT_INSTRUCTIONS: ${{ secrets.SHOP_PAYMENT_INSTRUCTIONS }}
          SHOP_BOT_USERNAME: ${{ secrets.SHOP_BOT_USERNAME }}
        run: |
          for n in TG_TOKEN TG_CHANNEL TG_OWNER_ID TG_WEBHOOK_SECRET RATE_SALT BOT_API_KEY BREVO_API_KEY MAIL_FROM SHOP_TG_TOKEN SHOP_TG_WEBHOOK_SECRET SHOP_OWNER_ID SHOP_PAYMENT_INSTRUCTIONS SHOP_BOT_USERNAME; do
            v="${!n}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx wrangler@4 secret put "$n"; else echo "skip $n (empty)"; fi
          done
